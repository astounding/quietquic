[package]
name = "quietquic"
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.88"
license = "0BSD"
description = "A PSK-authenticated variant of QUIC that remains silent to unauthorized connection attempts"
documentation = "https://docs.rs/quietquic"
repository = "https://github.com/astounding/quietquic"
homepage = "https://github.com/astounding/quietquic"
readme = "README.md"
keywords = ["quic", "transport", "psk", "privacy"]
categories = ["network-programming", "cryptography"]

# The root package is also the workspace root. `proto/` holds the sans-IO core
# this crate wraps; see docs/specs/2026-07-05-quietquic-core-design.md
[workspace]
members = ["proto"]

[dependencies]
quietquic-proto = { version = "=0.1.0-alpha.3", path = "proto" }
bytes = "1"
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "log", "bloom"] }
thiserror = "2"
socket2 = "0.6"
# Only `rt` is required, deliberately NOT `rt-multi-thread`: the runtime flavor
# is the application's choice, and a current-thread runtime is a legitimate and
# useful configuration (one OS thread, cooperative scheduling). Forcing the
# multi-threaded scheduler on every consumer would be wrong.
tokio = { version = "1", features = ["net", "rt", "macros", "time", "sync"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
aws-lc-rs = "1"
tokio = { version = "1", features = ["full"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std"] }
