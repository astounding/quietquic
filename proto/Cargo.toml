[package]
name = "quietquic-proto"
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.88"
license = "0BSD"
description = "Sans-IO core for quietquic: cloaked QUIC protocol state machine with no I/O, no runtime, and no threads."
documentation = "https://docs.rs/quietquic-proto"
repository = "https://github.com/astounding/quietquic"
homepage = "https://github.com/astounding/quietquic"
readme = "../README.md"
keywords = ["quic", "transport", "psk", "sans-io", "privacy"]
categories = ["network-programming", "cryptography"]

# NOTE: there is deliberately NO `tokio` dependency here, and none may be added.
# This crate performs no I/O, spawns nothing, and never blocks, so that callers
# can drive it from their own event loop. `cargo tree -p quietquic-proto` must
# never mention tokio.
[dependencies]
aws-lc-rs = "1"
blake3 = "1"
bytes = "1"
hex = "0.4"
# Use the aws-lc-rs backend (not the default ring) so quinn-proto's
# HmacKey/HandshakeTokenKey impls line up with our aws-lc-rs primitives and the
# whole crypto stack shares one backend.
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "log", "bloom"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
